<title>ตำบลฮอนกฮูก 3 มิติ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed terrain. Phone: one bottom sheet (3 snap heights) holds story or explore tools; thumb-zone nav at its foot.
   Wide / landscape: the sheet docks as a left column. Water-gauge rail floats on the right edge like the real staff gauge. */
:root{
  --bg:#e9eee8; --panel:#fbfcf9; --panel-2:#f0f4ef; --ink:#17231d; --muted:#5a6a61; --line:#d3dcd3;
  --accent:#17607a; --accent-ink:#ffffff; --accent-soft:#dcebf0;
  --warn:#b8520f; --danger:#b42318; --ok:#2f7d4f; --mud:#6b4a2c;
  --shadow:0 8px 28px rgba(16,32,24,.18); --shadow-s:0 2px 8px rgba(16,32,24,.14);
  --f-display:"Anuphan","Sarabun",system-ui,sans-serif; --f-body:"Sarabun",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --panel:#16211c; --panel-2:#1d2a24; --ink:#e4ede8; --muted:#9bb0a5; --line:#2c3b34;
  --accent:#6cbad4; --accent-ink:#08161b; --accent-soft:#1d3640; --warn:#f0904f; --danger:#f2766b; --ok:#6cc58f; --mud:#c69a6d;
  --shadow:0 8px 28px rgba(0,0,0,.55); --shadow-s:0 2px 8px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --panel:#16211c; --panel-2:#1d2a24; --ink:#e4ede8; --muted:#9bb0a5; --line:#2c3b34;
  --accent:#6cbad4; --accent-ink:#08161b; --accent-soft:#1d3640; --warn:#f0904f; --danger:#f2766b; --ok:#6cc58f; --mud:#c69a6d;
  --shadow:0 8px 28px rgba(0,0,0,.55); --shadow-s:0 2px 8px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
#scene{position:fixed;inset:0;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font:600 12px/1.25 var(--f-display);white-space:nowrap;display:flex;align-items:center;gap:5px;
  background:var(--panel);color:var(--ink);border-radius:7px;padding:3px 7px;box-shadow:var(--shadow-s);will-change:transform}
.lbl::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);z-index:-1}
.lbl i{width:9px;height:9px;border-radius:50%;flex:none}
.lbl.person{background:#fff1df;color:#6b2a08}
.lbl.broken{background:var(--danger);color:#fff}
.lbl.hit{background:#2e1b0e;color:#ffd9b8}
/* ---- top bar */
.top{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.brand{font:700 16px/1.1 var(--f-display);background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-s);white-space:nowrap}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;box-shadow:var(--shadow-s);margin-left:auto}
.seg button{font:600 14px var(--f-display);padding:7px 12px;border-radius:9px;color:var(--muted);white-space:nowrap;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.icon{width:44px;height:44px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow-s);display:grid;place-items:center;flex:none}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* ---- right rail: tools + gauge */
.rail{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.gauge{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));
  background:var(--panel);border-radius:12px;box-shadow:var(--shadow-s);padding:8px 8px 6px;display:grid;justify-items:center;gap:3px;width:62px;--gh:72px;transition:opacity .2s}
.gauge.off{opacity:0;pointer-events:none}
.gauge .stick{position:relative;width:16px;height:var(--gh,120px);border-radius:3px;overflow:hidden;
  background:linear-gradient(to top,#2f7d4f 0 25%,#d9a21a 25% 50%,#c0392b 50% 83%,#7b1d14 83% 100%)}
.gauge .stick::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 9px,rgba(255,255,255,.75) 9px 10px)}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(40,110,190,.78);border-top:2px solid #cfe6ff;transition:height .6s ease}
.gauge b{font:700 15px/1 var(--f-display);font-variant-numeric:tabular-nums}
.gauge small{font-size:11px;line-height:1.2;color:var(--muted);text-align:center}
/* ---- sheet */
.sheet{position:fixed;z-index:4;left:0;right:0;bottom:0;height:var(--sh,46vh);background:var(--panel);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1)}
.sheet.dragging{transition:none}
.grab{flex:none;padding:8px 0 2px;touch-action:none;cursor:grab;display:grid;place-items:center}
.grab span{width:42px;height:5px;border-radius:3px;background:var(--line)}
.sh-head{flex:none;padding:2px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));touch-action:none}
.kicker{display:flex;align-items:center;gap:8px;font:600 13px var(--f-display);color:var(--accent)}
.kicker .count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-head h2{font:700 21px/1.25 var(--f-display);margin:2px 0 0;text-wrap:balance}
.facts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0 max(16px,env(safe-area-inset-left,0px))}
.facts::-webkit-scrollbar{display:none}
.fact{flex:none;background:var(--panel-2);border-radius:10px;padding:4px 10px;line-height:1.3}
.fact small{display:block;font-size:11px;color:var(--muted)}
.fact b{font:600 14px var(--f-display);white-space:nowrap}
.fact.alert{background:color-mix(in srgb,var(--danger) 14%,var(--panel))}
.fact.alert b{color:var(--danger)}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.lead{font-size:17px;font-weight:500;margin:12px 0 4px}
.sec{margin-top:14px}
.sec h3{font:700 15px var(--f-display);margin:0 0 2px;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.sec p{margin:4px 0;max-width:62ch}
.mapnote{margin-top:16px;display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.mapnote svg{width:20px;height:20px;flex:none;margin-top:2px;stroke:var(--accent);fill:none;stroke-width:2}
.sh-foot{flex:none;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.btn{min-height:48px;border-radius:12px;padding:0 16px;font:600 16px var(--f-display);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn:disabled{opacity:.35;cursor:default}
.track{display:flex;gap:3px;flex:1;min-width:0}
.track button{flex:1;height:28px;display:grid;align-items:center}
.track button::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.track button.past::before{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.track button.on::before{background:var(--accent);height:10px}
.sh-foot.story{flex-wrap:wrap}
.sh-foot.story .track{order:-1;flex-basis:100%}
/* explore */
.group{margin-top:16px}
.group h3{font:700 13px var(--f-display);letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel-2);border-radius:999px;padding:8px 14px;font:600 14px var(--f-display);min-height:40px}
.chip.on{background:var(--ink);color:var(--panel)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw:last-child{border-bottom:0}
.sw .swatch{width:26px;height:18px;border-radius:4px;flex:none}
.sw span{flex:1;line-height:1.35}
.sw small{display:block;color:var(--muted);font-size:13px}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(18px)}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvls button{background:var(--panel-2);border-radius:10px;padding:6px 4px;font:600 13px/1.25 var(--f-display);min-height:48px}
.lvls button small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.lvls button.on{background:var(--accent);color:var(--accent-ink)}
.lvls button.on small{color:inherit}
.slider{display:grid;gap:2px;margin-top:10px}
.slider label{display:flex;justify-content:space-between;font-size:14px}
.slider input{width:100%;accent-color:var(--accent);height:32px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
/* popover (layers while in story) */
.pop{position:fixed;z-index:7;right:max(12px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:min(340px,calc(100vw - 24px));
  max-height:calc(100% - 200px);overflow:auto;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 14px 10px}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px;font:700 16px var(--f-display)}
.pop-h .icon{box-shadow:none;background:var(--panel-2);width:36px;height:36px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
/* info */
.info-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{border-radius:999px;padding:2px 10px;font:600 13px var(--f-display);background:var(--panel-2)}
.tag.r{background:var(--danger);color:#fff}.tag.o{background:var(--warn);color:#fff}.tag.b{background:var(--accent);color:var(--accent-ink)}
.story-box{background:#fff1df;color:#5c2a0b;border-radius:12px;padding:10px 12px;margin:8px 0}
.story-box.dark{background:#2e1b0e;color:#ffd9b8}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kv div{background:var(--panel-2);border-radius:10px;padding:6px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font:600 15px var(--f-display);font-variant-numeric:tabular-nums}
.kv div.hl{background:color-mix(in srgb,var(--warn) 16%,var(--panel))}
.kv div.wide{grid-column:1/-1}
/* hint + loading */
.hint{position:fixed;z-index:8;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(15,25,20,.82);color:#fff;border-radius:14px;padding:12px 16px;
  font:600 15px/1.5 var(--f-display);text-align:center;pointer-events:none;transition:opacity .4s;max-width:80vw}
.loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);font:600 16px var(--f-display);color:var(--muted)}
/* wide screens and landscape phones: sheet docks left */
@media (min-width:900px), (orientation:landscape) and (max-height:540px){
  .sheet{top:calc(64px + env(safe-area-inset-top,0px));bottom:12px;left:max(12px,env(safe-area-inset-left,0px));right:auto;width:min(430px,46vw);height:auto!important;border-radius:var(--r)}
  .grab{display:none}
  .sh-foot{padding-bottom:10px;border-radius:0 0 var(--r) var(--r)}
}
@media (min-width:900px), (orientation:landscape) and (max-height:540px){
  .gauge{left:auto;right:max(12px,env(safe-area-inset-right,0px));top:calc(170px + env(safe-area-inset-top,0px))}
}
@media (orientation:landscape) and (max-height:540px){
  .sh-foot.story .track{display:none}
  .btn{min-height:42px}
  .gauge{top:calc(160px + env(safe-area-inset-top,0px))}
  .top{padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .sheet{top:calc(56px + env(safe-area-inset-top,0px));bottom:8px}
  .rail{top:calc(56px + env(safe-area-inset-top,0px))}
  .sh-head h2{font-size:18px}
}
@media (max-width:380px){.brand{display:none}.seg{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* capture mode used to render still images for the printed case book */
body.capture .top,body.capture .rail,body.capture .sheet,body.capture .pop,body.capture .hint,body.capture .loading{display:none!important}
body.capture .lbl{font-size:15px;padding:4px 9px}
body.capture .gauge{top:16px;left:16px;transform:scale(1.15);transform-origin:top left}
</style>

<div id="scene"></div>
<div id="labels"></div>

<div class="top">
  <div class="brand">ตำบลฮอนกฮูก</div>
  <div class="seg" role="group" aria-label="โหมด">
    <button id="mStory" aria-pressed="true">เรื่องเล่า</button>
    <button id="mExplore" aria-pressed="false">สำรวจแผนที่</button>
  </div>
  <button class="icon" id="bHelp" aria-label="วิธีใช้และสัญลักษณ์" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg></button>
</div>

<div class="rail">
  <button class="icon" id="bLayers" aria-label="ชั้นข้อมูล" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg></button>
  <button class="icon" id="bRecenter" aria-label="กลับไปมุมมองของช่วงนี้"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
  </div>
<div class="gauge" id="gauge" aria-live="polite" title="ระดับน้ำเหนือคลอง">
    <div class="stick"><div class="fill" id="gFill"></div></div>
    <b id="gVal">0.0</b><small>ม. เหนือคลอง</small>
    <small id="gWet"></small>
</div>

<section class="sheet" id="sheet" aria-label="แผงข้อมูล">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="ลากเพื่อย่อหรือขยาย"><span></span></div>
  <div class="sh-head" id="shHead"></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot" id="shFoot"></div>
</section>

<div class="pop" id="pop" hidden></div>
<div class="hint" id="hint">ลากหนึ่งนิ้วเพื่อหมุน<br>ใช้สองนิ้วเพื่อซูมและเลื่อน<br>แตะบ้านเพื่อดูว่าใครอยู่ในบ้าน</div>
<div class="loading" id="loading">กำลังสร้างภูมิประเทศ…</div>

<template id="tLayers">
  <label class="sw"><i class="swatch" style="background:linear-gradient(90deg,#1e4f9c,#4f8fd6,#a7c9ef)"></i><span>พื้นที่เสี่ยงน้ำท่วม<small>เข้ม = ท่วมทุกปี · กลาง = ปีน้ำมาก · อ่อน = ปีวิกฤต</small></span><input class="toggle" type="checkbox" data-l="zone"></label>
  <label class="sw"><i class="swatch" style="background:#f08a24"></i><span>เส้นทางน้ำป่าไหลหลาก<small>ทางน้ำจากภูเขาที่รับน้ำจากพื้นที่กว้าง</small></span><input class="toggle" type="checkbox" data-l="flash"></label>
  <label class="sw"><i class="swatch" style="background:#c62828"></i><span>ลาดชันเสี่ยงดินถล่ม<small>ความชันมากและเป็นร่องรับน้ำ</small></span><input class="toggle" type="checkbox" data-l="ls"></label>
  <label class="sw"><i class="swatch" style="background:#8b3fa6"></i><span>แอ่งน้ำขัง<small>น้ำค้างนานหลังน้ำลด</small></span><input class="toggle" type="checkbox" data-l="pond"></label>
  <label class="sw"><i class="swatch" style="background:#e8590c"></i><span>บ้านที่มีกลุ่มเปราะบาง<small>ติดเตียง ฟอกไต ตั้งครรภ์ ใช้ออกซิเจน จิตเวช</small></span><input class="toggle" type="checkbox" data-l="vul"></label>
  <label class="sw"><i class="swatch" style="background:repeating-linear-gradient(90deg,#2f9e44 0 6px,transparent 6px 9px)"></i><span>เส้นทางอพยพ<small>ไปวัดควนนกฮูก หรือที่ทำการ อบต.</small></span><input class="toggle" type="checkbox" data-l="evac"></label>
  <label class="sw"><i class="swatch" style="background:#3a86c8"></i><span>แสดงน้ำท่วม</span><input class="toggle" type="checkbox" data-l="water"></label>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = /*DATA*/null;
</script>
<script>
(function(){
const V = DATA.village, S = DATA.story, N = DATA.n, CELL = DATA.cell, UNIT = 10;
const W = (N - 1) * CELL / UNIT;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const elev = new Uint16Array(b64(DATA.elev).buffer);
const handA = b64(DATA.hand);
const Z = (x, y) => { x = Math.max(0, Math.min(N - 1, Math.round(x))); y = Math.max(0, Math.min(N - 1, Math.round(y))); return elev[y * N + x] / 10; };
let exag = 1.8;
const wx = x => (x - (N - 1) / 2) * CELL / UNIT, wz = y => (y - (N - 1) / 2) * CELL / UNIT;
const wy = z => (z - DATA.zmin) * exag / UNIT;
const LV = V.levels;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const KIND = {hospital:["รพ.สต.","#c92a2a"],school:["โรงเรียน","#1971c2"],childcare:["ศพด.","#e8590c"],temple:["วัด","#b8860b"],
  office:["อบต.","#5f3dc4"],mosque:["มัสยิด","#0b7285"],water:["ประปา","#1098ad"],market:["ตลาด","#868e96"],gauge:["ไม้วัดน้ำ","#2b8a3e"]};

const U = {
  base:{value:baseTex}, haz:{value:hazTex}, exag:{value:exag}, zmin:{value:DATA.zmin}, unit:{value:UNIT},
  showZone:{value:0}, showFlash:{value:0}, showPond:{value:0}, showLS:{value:0}, flashOn:{value:0}, time:{value:0},
  slide:{value:new THREE.Vector3(0,0,0)}, lv1:{value:LV.yearly}, lv2:{value:LV.heavy}, lv3:{value:LV.extreme}
};
const terrain = new THREE.Mesh(geo, new THREE.ShaderMaterial({uniforms:U, vertexShader:`
  attribute float hand; attribute float elev; varying vec2 vUv; varying float vHand; varying vec2 vXZ;
  uniform float exag, zmin, unit;
  void main(){ vUv=uv; vHand=hand; vec3 p=position; p.y=(elev-zmin)*exag/unit; vXZ=p.xz;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
 fragmentShader:`
  uniform sampler2D base, haz; uniform float showZone, showFlash, showPond, showLS, flashOn, time, lv1, lv2, lv3; uniform vec3 slide;
  varying vec2 vUv; varying float vHand; varying vec2 vXZ;
  void main(){
    vec3 c=texture2D(base,vUv).rgb; vec3 h=texture2D(haz,vUv).rgb;
    if(showZone>.5){ vec3 z=vHand<=lv1?vec3(.12,.31,.61):vHand<=lv2?vec3(.31,.56,.84):vHand<=lv3?vec3(.65,.79,.94):vec3(-1.);
      if(z.x>=0.) c=mix(c,z,.6); }
    if(showLS>.5){ float t=smoothstep(.55,.9,h.r); c=mix(c,vec3(.78,.16,.16),t*.65); }
    if(showPond>.5){ float t=smoothstep(.12,.5,h.b); c=mix(c,vec3(.55,.25,.65),t*.8); }
    float fl=smoothstep(.3,.7,h.g);
    if(showFlash>.5) c=mix(c,vec3(.94,.54,.14),fl*.65);
    if(flashOn>.5){ float s=.5+.5*sin((vXZ.x*.35+vXZ.y*.12)-time*5.); c=mix(c,vec3(.55,.36,.18),fl*(.4+.4*s)); }
    if(slide.z>0.){ float d=length(vXZ-slide.xy); float t=(1.-smoothstep(slide.z*.6,slide.z,d))*smoothstep(.35,.6,h.r+.25);
      c=mix(c,vec3(.42,.28,.16),t*.9); }
    gl_FragColor=vec4(c,1.);
  }`}));

  attribute float hand; attribute float elev; uniform float level, exag, zmin, unit; varying float vD; varying vec2 vXZ; varying vec2 vUv;
  void main(){ vec3 p=position; float d=level-hand; vD=d; vXZ=p.xz; vUv=uv; p.y=(elev-zmin+max(d,0.)+.05)*exag/unit;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
 fragmentShader:`
  uniform float time, flashOn, showFlash; uniform sampler2D haz, flow; varying float vD; varying vec2 vXZ; varying vec2 vUv;
  void main(){ if(vD<=0.02) discard; float a=clamp(.45+vD*.12,.45,.85);
    vec3 c=mix(vec3(.45,.68,.80),vec3(.12,.33,.55),clamp(vD/4.,0.,1.));
    c+=.04*sin(vXZ.x*.8+time*1.5)*sin(vXZ.y*.7-time);
    float fl=smoothstep(.25,.65,texture2D(haz,vUv).g);
    if(flashOn>.5 && fl>0.){
      vec2 dir=texture2D(flow,vUv).rg*2.-1.;            // downstream direction (x = east, y = south)
      vec2 perp=vec2(-dir.y,dir.x);
      float along=dot(vXZ,dir), across=dot(vXZ,perp);
      float wob=sin(across*.45+time*.7)*1.6+sin(across*1.3-along*.2)*.6;
      float streak=.5+.5*sin(along*.55-time*4.5+wob);
      float streak2=.5+.5*sin(along*1.4-time*7.+across*.9);
      float foam=smoothstep(.9,1.,streak*streak2)*(.5+.5*sin(across*2.3+time*1.3));
      vec3 mud=mix(vec3(.47,.32,.18),vec3(.62,.45,.26),streak*.55+streak2*.25);
      c=mix(c,mud,fl*.9); c=mix(c,vec3(.93,.88,.78),foam*fl*.7);

    } else if(showFlash>.5){ c=mix(c,vec3(.94,.54,.14),fl*.55); a=mix(a,.9,fl*.6); }

labels.sort((a, b) => b.prio - a.prio);
const v3 = new THREE.Vector3();
function drawLabels(E){
  const w = innerWidth, h = innerHeight;
  const placed = [...document.querySelectorAll(".gauge:not(.off),.rail,.top>*")].map(el => { const r = el.getBoundingClientRect(); return {x:r.left, y:r.top, w:r.width, h:r.height}; });
  const sr = sheetRect();
  labels.forEach(L => {
    if (L.test && !L.test(E)) { L.el.hidden = true; return; }
    v3.set(wx(L.x), wy(L.z), wz(L.y)).project(camera);
    if (v3.z > 1) { L.el.hidden = true; return; }
    const sx = (v3.x + 1) / 2 * w, sy = (1 - v3.y) / 2 * h;
    if (!L.w) { L.el.hidden = false; L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; }
    const r = {x:sx - L.w / 2, y:sy - L.h - 6, w:L.w, h:L.h};
    const off = r.x < 4 || r.x + r.w > w - 4 || r.y < 0 || r.y + r.h > h || (sr && r.x < sr.right && r.x + r.w > sr.left && r.y + r.h > sr.top && r.y < sr.bottom);
    const clash = placed.some(p => r.x < p.x + p.w + 4 && r.x + r.w + 4 > p.x && r.y < p.y + p.h + 2 && r.y + r.h + 2 > p.y);
    if (off || clash) { L.el.hidden = true; return; }
    placed.push(r); L.el.hidden = false; L.el.style.transform = `translate(${r.x | 0}px,${r.y | 0}px)`;
  });
}

// ================= sheet sizing (phone): peek / half / full
const docked = () => matchMedia("(min-width:900px), (orientation:landscape) and (max-height:540px)").matches;
const sheet = $("sheet");
let snap = "half";
function snapPx(s){ const h = innerHeight; const head = $("shHead").offsetHeight + $("shFoot").offsetHeight + 22;
  return s === "peek" ? head : s === "full" ? Math.round(h * .86) : Math.max(head + 120, Math.round(h * .46)); }
function setSnap(s){ snap = s; sheet.style.setProperty("--sh", snapPx(s) + "px"); setTimeout(resize, 300); }
function sheetRect(){ return sheet.getBoundingClientRect(); }
(function dragSheet(){
  let y0 = null, h0 = 0, moved = false;
  const start = e => { if (docked()) return; y0 = e.clientY; h0 = sheet.offsetHeight; moved = false; sheet.classList.add("dragging"); e.currentTarget.setPointerCapture?.(e.pointerId); };
  const move = e => { if (y0 == null) return; const dy = y0 - e.clientY; if (Math.abs(dy) > 4) moved = true;
    sheet.style.setProperty("--sh", Math.max(snapPx("peek"), Math.min(innerHeight * .9, h0 + dy)) + "px"); };
  const end = e => { if (y0 == null) return; sheet.classList.remove("dragging"); const hNow = sheet.offsetHeight; y0 = null;
    if (!moved) { setSnap(snap === "peek" ? "half" : snap === "half" ? "full" : "peek"); return; }
    const opts = ["peek", "half", "full"]; setSnap(opts.reduce((a, b) => Math.abs(snapPx(b) - hNow) < Math.abs(snapPx(a) - hNow) ? b : a)); };
  [$("grab"), $("shHead")].forEach(el => { el.addEventListener("pointerdown", start); el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); });
  $("grab").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSnap(snap === "full" ? "peek" : snap === "peek" ? "half" : "full"); } });
})();

      <div class="stat" id="xstat"></div></div>
    <div class="group"><h3>ไปที่</h3><div class="chips">${Object.entries(CAMS).map(([k, c]) => `<button class="chip${E.place === k ? " on" : ""}" data-cam="${k}">${c.label}</button>`).join("")}</div></div>
    <div class="group"><h3>ชั้นข้อมูล</h3><div id="xLayers"></div></div>
    <div class="group"><h3>ความสูงของภูเขา</h3><div class="slider"><label for="exag"><span>ขยายแนวตั้ง</span><b id="exv">${exag.toFixed(1)} เท่า</b></label><input type="range" id="exag" min="1" max="3" step="0.1" value="${exag}"></div></div>
    <p class="note">ภูมิประเทศจากข้อมูลดาวเทียม SRTM ความละเอียดประมาณ 19 เมตร ส่วนชุมชน ผู้คน และเหตุการณ์เป็นเรื่องสมมติ แบบจำลองน้ำเป็นแบบง่ายเพื่อการเรียนรู้ ไม่ใช่การพยากรณ์</p>`;
  $("xLayers").appendChild($("tLayers").content.cloneNode(true));
  $("shFoot").className = "sh-foot";
  $("shFoot").innerHTML = `<button class="btn ghost" data-act="xreset" style="flex:1">${IC.restart}รีเซ็ตแผนที่</button><button class="btn primary" data-act="tostory">ไปที่เรื่องเล่า</button>`;
  xStat(); apply();
}
function xStat(){ const L = state.explore.level; const wetH = hh.filter(h => h.hand < L - 0.3);
  const vul = wetH.filter(isVul).length; const ppl = wetH.reduce((a, h) => a + h.members, 0);
  const fac = V.facilities.filter(f => f.hand < L).map(f => SHORT[f.id]);
  const el = $("xstat"); if (!el) return;
  el.innerHTML = `<div><b>${wetH.length}</b><small>บ้านน้ำเข้า (${ppl} คน)</small></div><div><b>${vul}</b><small>บ้านกลุ่มเปราะบางที่น้ำเข้า</small></div>
    <div style="grid-column:1/-1"><small>สถานที่ที่น้ำท่วม</small><br><b style="font-size:15px">${fac.length ? fac.join(" · ") : "ไม่มี"}</b></div>`; }
function renderInfo(html){
  state.info = true; closePop();
  $("shHead").innerHTML = ""; $("shBody").innerHTML = html; $("shBody").scrollTop = 0;
  $("shFoot").className = "sh-foot";
  $("shFoot").innerHTML = `<button class="btn ghost" data-act="closeinfo" style="flex:1">${IC.back}กลับไป${state.mode === "story" ? "ที่เรื่องเล่า" : "ที่การสำรวจ"}</button>`;
  if (!docked() && snap === "peek") setSnap("half");
}
function render(){ state.info = null; state.mode === "story" ? renderStory() : renderExplore(); }

// ================= actions
function showStage(i, instant){ state.i = Math.max(0, Math.min(S.stages.length - 1, i)); state.override = {}; closePop(); render(); apply(); goCam(camKey(), instant); }
function setMode(m){ state.mode = m; $("mStory").setAttribute("aria-pressed", m === "story"); $("mExplore").setAttribute("aria-pressed", m === "explore");
  closePop(); render(); apply(); goCam(camKey()); }
function exploreReset(){ state.explore = {layers:{...DEFAULT_LAYERS}, level:0, place:null}; exag = 1.8; U.exag.value = exag; placeHouses(); placeFac(); buildEvac(); render(); apply(); goCam("overview"); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-go],[data-lv],[data-cam]"); if (!t) return;
  if (t.dataset.go != null) return showStage(+t.dataset.go);
  if (t.dataset.lv != null) { state.explore.level = +t.dataset.lv; renderExplore(); return; }
  if (t.dataset.cam) { state.explore.place = t.dataset.cam; document.querySelectorAll("[data-cam]").forEach(c => c.classList.toggle("on", c === t)); goCam(t.dataset.cam); return; }
  const a = t.dataset.act;
  if (a === "prev") showStage(state.i - 1); else if (a === "next") showStage(state.i + 1);
  else if (a === "restart") { exag = 1.8; U.exag.value = exag; placeHouses(); placeFac(); buildEvac(); showStage(0); }
  else if (a === "xreset") exploreReset(); else if (a === "tostory") setMode("story");
  else if (a === "closeinfo") render(); else if (a === "closepop") closePop();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "lvl") { state.explore.level = +t.value; $("lvlv").textContent = (+t.value).toFixed(1) + " ม.";
    document.querySelectorAll("[data-lv]").forEach(b => b.classList.toggle("on", Math.abs(+b.dataset.lv - state.explore.level) < .05)); xStat(); apply(); }
  if (t.id === "exag") { exag = +t.value; U.exag.value = exag; $("exv").textContent = exag.toFixed(1) + " เท่า"; placeHouses(); placeFac(); buildEvac(); labels.forEach(L => L.w = 0); }
});
document.addEventListener("change", e => { const k = e.target.dataset && e.target.dataset.l; if (!k) return;
  if (state.mode === "story") state.override[k] = e.target.checked; else state.explore.layers[k] = e.target.checked; apply(); });
$("mStory").onclick = () => state.mode !== "story" && setMode("story");
$("mExplore").onclick = () => state.mode !== "explore" && setMode("explore");
$("bRecenter").onclick = () => goCam(camKey());
document.addEventListener("keydown", e => { if (state.mode !== "story" || e.target.closest("input")) return;
  if (e.key === "ArrowRight") showStage(state.i + 1); if (e.key === "ArrowLeft") showStage(state.i - 1); });

// popovers: layers (story mode quick toggles) and help
const pop = $("pop");
function closePop(){ pop.hidden = true; $("bLayers").setAttribute("aria-pressed", "false"); $("bHelp").setAttribute("aria-pressed", "false"); }
function openPop(which){
  if (!pop.hidden && pop.dataset.w === which) return closePop();
  closePop(); pop.dataset.w = which;
  if (which === "layers") {
    if (state.mode === "explore") { if (!docked()) setSnap("full"); $("xLayers")?.scrollIntoView({behavior:reduced ? "auto" : "smooth"}); return; }
    pop.innerHTML = `<div class="pop-h">ชั้นข้อมูล<button class="icon" data-act="closepop" aria-label="ปิด">${IC.close}</button></div><div id="pL"></div>
      <p class="note">ช่วงนี้ของเรื่องเล่าเปิดชั้นข้อมูลที่เกี่ยวข้องไว้ให้แล้ว ถ้าเปิดหรือปิดเพิ่ม การตั้งค่าจะกลับเป็นแบบเดิมเมื่อเปลี่ยนช่วง</p>`;
    $("pL").appendChild($("tLayers").content.cloneNode(true)); apply(); $("bLayers").setAttribute("aria-pressed", "true");
  } else {
    pop.innerHTML = `<div class="pop-h">วิธีใช้<button class="icon" data-act="closepop" aria-label="ปิด">${IC.close}</button></div>
      <p style="margin:4px 0">หนึ่งนิ้ว: หมุนมุมมอง · สองนิ้ว: ซูมและเลื่อน · แตะบ้านหรืออาคาร: ดูข้อมูล</p>
      <p style="margin:4px 0"><b>เรื่องเล่า</b>: กดถัดไปเพื่อดูเหตุการณ์ทีละช่วง แผนที่จะเปลี่ยนระดับน้ำและเหตุการณ์ตามช่วงนั้น ลากแถบด้านบนของแผงขึ้นหรือลงเพื่อดูแผนที่มากขึ้น</p>
      <p style="margin:4px 0"><b>สำรวจแผนที่</b>: เลือกระดับน้ำ เปิดชั้นข้อมูล และไปดูแต่ละหมู่ได้เอง</p>
      <div class="pop-h" style="font-size:15px">สัญลักษณ์</div>
      ${Object.entries(KIND).map(([k, [t, c]]) => `<div class="sw" style="cursor:default"><i class="swatch" style="background:${c}"></i><span>${esc(V.facilities.find(f => f.kind === k).name)}</span></div>`).join("")}
      <div class="sw" style="cursor:default"><i class="swatch" style="background:#efe6d2;border:1px solid #bbb"></i><span>บ้าน (120 หลัง)</span></div>
      <div class="sw" style="cursor:default"><i class="swatch" style="background:#e8590c"></i><span>บ้านที่มีกลุ่มเปราะบาง</span></div>
      <div class="sw" style="cursor:default"><i class="swatch" style="background:#4f86bd"></i><span>บ้านที่น้ำเข้าตามระดับน้ำขณะนั้น</span></div>
      <div class="sw" style="cursor:default"><i class="swatch" style="background:#2e1b0e"></i><span>บ้านที่ถูกดินถล่มทับ</span></div>
      <p class="note">ไม้วัดระดับน้ำด้านขวาบอกว่าน้ำสูงกว่าระดับคลองปกติกี่เมตร แถบเขียว เหลือง และแดงเหมือนไม้วัดระดับน้ำจริงในชุมชน</p>
      <p class="note">ภูมิประเทศจาก SRTM ส่วนชุมชน ผู้คน และเหตุการณ์เป็นเรื่องสมมติ แบบจำลองน้ำเป็นแบบง่าย คำนวณจากความสูงเหนือทางน้ำที่ใกล้ที่สุด</p>`;
    $("bHelp").setAttribute("aria-pressed", "true");
  }
  pop.hidden = false;
}
$("bLayers").onclick = () => openPop("layers");
$("bHelp").onclick = () => openPop("help");

// ================= tap to inspect
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null;
const hint = $("hint"); const hideHint = () => { hint.style.opacity = 0; setTimeout(() => hint.hidden = true, 400); };
setTimeout(hideHint, 5000);
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; if (!hint.hidden) hideHint(); closePop(); });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([houseMesh, ...facMeshes])[0];
  if (!hit) return;
  if (hit.object === houseMesh) infoHouse(hh[hit.instanceId]); else infoFac(hit.object.userData.fac);
});
function infoHouse(h){
  const vil = V.villages.find(v => v.moo === h.moo); const E = lastE;
  const depth = E.layers.water ? Math.max(0, E.level - h.hand) : 0;
  const cell = (k, v, hl, wide) => `<div class="${hl ? "hl" : ""}${wide ? " wide" : ""}"><small>${k}</small><b>${v}</b></div>`;
  renderInfo(`<div class="kicker" style="margin-top:12px"><span>หมู่ ${h.moo} ${esc(vil.name)}</span><span class="count">รหัส ${h.id}</span></div>
    <h2 style="font:700 21px var(--f-display);margin:2px 0 0">บ้านเลขที่ ${esc(h.no)}</h2>
    ${h.story ? `<div class="story-box">${esc(h.story)}</div>` : ""}
    ${E.landslide && h.hit ? `<div class="story-box dark">ในเรื่องเล่า บ้านหลังนี้ถูกดินถล่มทับเมื่อเช้ามืดวันอาทิตย์</div>` : ""}
    ${riskTags(h)}
    ${depth > 0.3 ? `<p style="margin:0 0 8px"><b>ตอนนี้น้ำในบ้านลึกประมาณ ${depth.toFixed(1)} เมตร</b></p>` : ""}
    <div class="kv">${cell("สมาชิก", h.members + " คน")}${cell("ผู้สูงอายุ 60+", h.elderly || "–", h.elderly)}${cell("เด็กเล็กต่ำกว่า 5 ปี", h.under5 || "–", h.under5)}
      ${cell("ติดเตียง", h.bedridden ? "มี" : "–", h.bedridden)}${cell("พิการ", h.disabled ? "มี" : "–", h.disabled)}${cell("ตั้งครรภ์", h.pregnant ? "มี" : "–", h.pregnant)}
      ${cell("เบาหวาน/ความดัน", h.ncd ? h.ncd + " คน" : "–", h.ncd)}${cell("ฟอกไต", h.dialysis ? "มี" : "–", h.dialysis)}${cell("ผู้ป่วยจิตเวช", h.psych ? "มี" : "–", h.psych)}
      ${cell("สัตว์เลี้ยง", h.livestock ? "มี" : "–")}${cell("ลักษณะบ้าน", esc(h.house), false, true)}${cell("น้ำดื่มน้ำใช้", esc(h.water))}${cell("อาชีพ", esc(h.job))}
      ${cell("สูงจากระดับคลอง", h.hand.toFixed(1) + " ม.", false, true)}</div>
    <p class="note">ข้อมูลสมมติเพื่อการฝึก</p>`);
}
function infoFac(f){
  const E = lastE; const depth = E.layers.water ? Math.max(0, E.level - f.hand) : 0;
  renderInfo(`<div class="kicker" style="margin-top:12px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${KIND[f.kind][1]}"></i> ${KIND[f.kind][0]}</span></div>
    <h2 style="font:700 21px var(--f-display);margin:2px 0 0">${esc(f.name)}</h2>${riskTags(f)}
    ${depth > 0.05 ? `<p style="margin:0 0 8px"><b>ตอนนี้น้ำท่วมสูงประมาณ ${depth.toFixed(1)} เมตร</b></p>` : ""}
    <div class="kv">${esc(f.info).split(" | ").map(t => `<div class="wide"><b style="font-weight:500;font-family:var(--f-body)">${t}</b></div>`).join("")}
    <div><small>ระดับพื้นดิน</small><b>${f.elev.toFixed(0)} ม. รทก.</b></div><div><small>สูงจากระดับคลอง</small><b>${f.hand.toFixed(1)} ม.</b></div></div>`);
}

// ================= loop
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h;
  const sr = sheetRect(); let ox = 0, oy = 0;
  if (document.body.classList.contains("capture")) {} else if (docked()) ox = -sr.right / 2; else oy = (h - sr.top) / 2 - 30;
  camera.setViewOffset(w, h, ox, oy, w, h); camera.updateProjectionMatrix();
}
addEventListener("resize", () => { if (!docked()) setSnap(snap); resize(); labels.forEach(L => L.w = 0); });
new ResizeObserver(resize).observe(sheet);
const themeSync = () => scene.background.set(skyCol());
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", themeSync);
new MutationObserver(themeSync).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let lt = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (t - lt) / 1000); lt = t;
  U.time.value = t / 1000;
  waterShown += (waterTarget - waterShown) * (reduced ? 1 : Math.min(1, dt * 3)); WU.level.value = waterShown;
  if (tween) { const k = Math.min(1, (t - tween.t0) / 1100), e = ease(k);
    camera.position.lerpVectors(tween.a, tween.b, e); controls.target.lerpVectors(tween.ta, tween.tb, e); if (k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera); if (lastE) drawLabels(lastE);
  const g = $("gauge"), gb = g.offsetTop + g.offsetHeight; g.classList.toggle("off", !docked() && sheet.getBoundingClientRect().top < gb + 8);
}
controls.addEventListener("start", () => { tween = null; });
placeHouses(); placeFac(); buildEvac();
render(); setSnap("half"); resize(); apply(); goCam(camKey(), true); waterShown = waterTarget;
$("loading").hidden = true;
requestAnimationFrame(loop);
// hook for the print pipeline (scripts/render_views.js); harmless for viewers
window.HNK = {
  capture(on){ document.body.classList.toggle("capture", on); resize(); labels.forEach(L => L.w = 0); },
  stage(i, cam){ state.mode = "story"; showStage(i, true); if (cam) goCam(cam, true); waterShown = waterTarget; WU.level.value = waterShown; },
  view(key){ goCam(key, true); }, stages: S.stages.length, cams: Object.keys(CAMS)
};
})();
</script>
